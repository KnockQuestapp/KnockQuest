<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">
  <script>
    (function setKnockQuestBasePath() {
      var host = window.location.hostname.toLowerCase();
      var base = host === 'knockquest.app' || host === 'www.knockquest.app'
        ? '/app/'
        : '/KnockQuest/app/';
      document.querySelector('base').setAttribute('href', base);
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KnockQuest helps door-to-door field teams map properties, log visits, manage leads, and keep follow-ups organized.">
  <meta name="author" content="Miguel Calina">
  <meta name="copyright" content="Copyright 2026 Miguel Calina. All rights reserved in original KnockQuest materials.">
  <meta name="knockquest-attribution-id" content="KQ-MC-2026-01">
  <link rel="alternate" type="application/json" href="ownership.json" title="KnockQuest ownership and provenance record">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="knockquest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>knockquest</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="ocr.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (async function loadKnockQuest() {
      const cleanupKey = 'knockquest-cache-cleaned-ad-sdk-staging-0.1.94';
      try {
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map((name) => caches.delete(name)));
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          if (registrations.length > 0) {
            await Promise.all(registrations.map((registration) => registration.unregister()));
            if (!sessionStorage.getItem(cleanupKey)) {
              sessionStorage.setItem(cleanupKey, '1');
              window.location.reload();
              return;
            }
          }
        }
      } catch (error) {
        console.warn('KnockQuest cache cleanup skipped:', error);
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=ad-sdk-staging-0.1.94';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
