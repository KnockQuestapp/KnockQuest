<!DOCTYPE html>
<html>
<head>
  <base href="/KnockQuest/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refreshing KnockQuest</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07120f;
      color: #f6f8ff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(90vw, 420px);
      padding: 28px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(12, 24, 20, .92);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      text-align: center;
    }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 4px solid rgba(255,255,255,.18);
      border-top-color: #35c784;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="spinner"></div>
    <h1>Refreshing KnockQuest</h1>
    <p>Clearing the old map cache and opening the updated property map.</p>
  </main>
  <script>
    (async function resetKnockQuestCache() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map((name) => caches.delete(name)));
        }
      } catch (error) {
        console.warn('KnockQuest cache reset skipped:', error);
      }
      window.location.replace('/KnockQuest/?v=remove-competitor-integration-20260923#/login');
    })();
  </script>
</body>
</html>
