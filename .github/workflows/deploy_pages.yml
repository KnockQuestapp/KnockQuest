name: deploy-pages

on:
  push:
    branches:
      - clean-final
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout compiled site
        uses: actions/checkout@v4
      - name: Reject source artifacts
        shell: bash
        run: |
          if find site -type f \( -name '*.map' -o -name '*.dart' -o -name '*.yaml' -o -name '*.lock' -o -name '*.symbols' -o -name '.last_build_id' \) | grep -q .; then
            echo 'Deployment contains a source artifact.' >&2
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
